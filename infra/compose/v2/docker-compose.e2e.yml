services:
  gateway:
    environment:
      TELEGRAM_MODE: webhook
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-stub-webhook-secret-set-at-runtime}
      READYZ_STRICT: 'true'
    ports: []


  worker:
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-stub-bot-token-set-at-runtime}
      TELEGRAM_API_BASE_URL: http://telegram-stub:18081
      KIOTVIET_STUB_BASE_URL: ${KIOTVIET_STUB_BASE_URL:-http://kiotviet-stub:18080}
      KIOTVIET_STUB_TOKEN: ${KIOTVIET_STUB_TOKEN:-stub-kiotviet-token-set-at-runtime}
      READYZ_STRICT: 'true'

  kiotviet-stub:
    image: node:20-bookworm-slim
    command:
      - node
      - -e
      - |
        require('http').createServer((req,res)=>{
          if(req.method==='POST'&&req.url==='/kiotviet/import-draft'){res.writeHead(200,{'content-type':'application/json'});res.end(JSON.stringify({external_reference_id:'kv-e2e-1',raw:{ok:true}}));return;}
          res.writeHead(404);res.end('not_found');
        }).listen(18080,'0.0.0.0')
    networks:
      - v2_private

  telegram-stub:
    # Minimal Telegram Bot API: getFile + file download (serves the E2E invoice workbook)
    # and sendMessage (records outbound notifications).
    image: node:20-bookworm-slim
    environment:
      TELEGRAM_STUB_FILE_B64: ${TELEGRAM_STUB_FILE_B64:-}
    command:
      - node
      - -e
      - |
        const fs=require('fs');
        const log='/tmp/telegram-send.log';
        const file=Buffer.from(process.env.TELEGRAM_STUB_FILE_B64||'','base64');
        const json=(res,body)=>{res.writeHead(200,{'content-type':'application/json'});res.end(JSON.stringify(body));};
        require('http').createServer((req,res)=>{
          const url=req.url||'';
          if(req.method==='POST'&&url.startsWith('/bot')&&url.endsWith('/getFile')){
            let body='';req.on('data',c=>body+=c);req.on('end',()=>{const fileId=(JSON.parse(body||'{}').file_id)||'';json(res,{ok:true,result:{file_id:fileId,file_path:'documents/invoice.xlsx'}});});
            return;
          }
          if(req.method==='GET'&&url.startsWith('/file/bot')&&url.endsWith('/documents/invoice.xlsx')){
            res.writeHead(200,{'content-type':'application/octet-stream'});res.end(file);return;
          }
          if(req.method==='POST'&&url.startsWith('/bot')&&url.endsWith('/sendMessage')){
            let body='';req.on('data',c=>body+=c);req.on('end',()=>{fs.appendFileSync(log,body+'\n');json(res,{ok:true,result:{message_id:Date.now()%1000000}});});
            return;
          }
          if(req.method==='GET'&&url==='/_sent_count'){
            const count=fs.existsSync(log)?fs.readFileSync(log,'utf8').trim().split('\n').filter(Boolean).length:0;
            json(res,{count});return;
          }
          res.writeHead(404);res.end('not_found');
        }).listen(18081,'0.0.0.0')
    networks:
      - v2_private
